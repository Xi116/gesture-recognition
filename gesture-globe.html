<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>手势地球</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Segoe UI',sans-serif}
#three-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
#topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:linear-gradient(to bottom,rgba(0,0,10,.85),transparent);pointer-events:none}
#topbar h1{font-size:17px;font-weight:600;color:rgba(130,200,255,.95);letter-spacing:1px}
#gesture-status{font-size:12px;color:rgba(130,200,255,.7);background:rgba(10,20,50,.55);padding:4px 12px;border-radius:20px;border:1px solid rgba(80,160,255,.2)}
#popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(480px,92vw);background:rgba(6,10,24,.93);border:1px solid rgba(80,160,255,.3);border-radius:16px;z-index:30;display:none;overflow:hidden;backdrop-filter:blur(12px);box-shadow:0 8px 40px rgba(0,0,0,.7)}
#popup.show{display:block}
#popup-header{padding:14px 18px;border-bottom:1px solid rgba(80,160,255,.15);display:flex;align-items:center;justify-content:space-between}
#popup-header h2{font-size:16px;color:rgba(140,210,255,.95)}
#popup-close{width:28px;height:28px;border-radius:50%;background:rgba(80,160,255,.15);border:none;color:rgba(140,210,255,.8);font-size:16px;cursor:pointer;line-height:28px;text-align:center}
#popup-body{padding:16px 18px}
#popup-body p{font-size:13px;color:rgba(160,210,255,.7);margin-bottom:10px;line-height:1.7}
#popup-body a{display:inline-block;padding:7px 18px;background:rgba(60,140,255,.25);border:1px solid rgba(80,160,255,.4);border-radius:20px;color:rgba(140,210,255,.95);font-size:13px;text-decoration:none}
#map-card{width:100%;height:240px;border-radius:10px;border:1px solid rgba(80,160,255,.2);margin-bottom:12px;background:#0a1428;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#hints{position:fixed;bottom:20px;left:20px;color:rgba(100,180,255,.55);font-size:12px;z-index:20;pointer-events:none;line-height:2.1}
#cam-wrap{position:fixed;bottom:20px;right:20px;width:200px;height:150px;z-index:10;border-radius:10px;overflow:hidden;border:1.5px solid rgba(80,160,255,.25)}
#input-video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#hand-overlay{position:absolute;top:0;left:0;width:100%;height:100%;transform:scaleX(-1)}
#cam-label{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);color:rgba(100,180,255,.6);font-size:10px;background:rgba(0,0,0,.4);padding:1px 8px;border-radius:10px;pointer-events:none}
#loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(120,200,255,.9);font-size:16px;z-index:40;text-align:center}
#loading .spinner{margin-bottom:10px;font-size:28px;animation:spin 2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<canvas id="three-canvas"></canvas>

<div id="topbar">
  <h1>🌍 手势地球</h1>
  <div id="gesture-status">✋ 等待手势…</div>
</div>

<div id="popup">
  <div id="popup-header">
    <h2 id="popup-title">📍 位置信息</h2>
    <button id="popup-close" onclick="document.getElementById('popup').classList.remove('show')">✕</button>
  </div>
  <div id="popup-body">
    <div id="map-card">
      <div id="map-emoji" style="font-size:32px;">🌏</div>
      <div id="map-city-name" style="font-size:15px;color:rgba(140,210,255,.95);font-weight:600;"></div>
      <div id="map-coords" style="font-size:11px;color:rgba(120,180,255,.6);"></div>
      <a id="map-baidu-link" href="#" target="_blank" style="margin-top:8px;padding:5px 16px;background:rgba(60,140,255,.2);border:1px solid rgba(80,160,255,.35);border-radius:20px;color:rgba(140,210,255,.9);font-size:12px;text-decoration:none">🗺️ 百度地图</a>
    </div>
    <p id="popup-desc"></p>
  </div>
</div>

<div id="hints">
  🖐 单手移动 → 旋转地球<br>
  🤲 双手捏合 → 缩放地球<br>
  👆 点击城市光点 → 查看详情
</div>

<div id="cam-wrap">
  <video id="input-video" autoplay muted playsinline></video>
  <canvas id="hand-overlay"></canvas>
  <div id="cam-label">手势控制</div>
</div>

<div id="loading">
  <div class="spinner">🌍</div>
  正在初始化…
</div>

<!-- External libs -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

<script>
// ═══════════════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════════════
const CITIES = [
  ['北京', 39.9, 116.4, '中华人民共和国的首都'],
  ['上海', 31.2, 121.5, '中国最大的城市'],
  ['香港', 22.3, 114.2, '国际金融中心'],
  ['东京', 35.7, 139.7, '日本首都'],
  ['首尔', 37.6, 126.9, '韩国首都'],
  ['新加坡', 1.3, 103.8, '花园城市'],
  ['曼谷', 13.8, 100.5, '泰国首都'],
  ['迪拜', 25.2, 55.3, '奢华之都'],
  ['伦敦', 51.5, -0.1, '英国首都'],
  ['巴黎', 48.9, 2.4, '法国首都'],
  ['柏林', 52.5, 13.4, '德国首都'],
  ['罗马', 41.9, 12.5, '意大利首都'],
  ['纽约', 40.7, -74.0, '美国第一大城市'],
  ['洛杉矶', 34.1, -118.2, '美国西海岸娱乐中心'],
  ['旧金山', 37.8, -122.4, '硅谷所在地'],
  ['芝加哥', 41.9, -87.6, '美国第三大城市'],
  ['里约热内卢', -22.9, -43.2, '巴西著名城市'],
  ['圣保罗', -23.5, -46.6, '南美洲最大城市'],
  ['开罗', 30.1, 31.2, '埃及首都'],
  ['悉尼', -33.9, 151.2, '澳大利亚最大城市'],
  ['墨尔本', -37.8, 144.9, '澳大利亚文化中心'],
  ['孟买', 19.1, 72.9, '印度最大城市'],
  ['德里', 28.6, 77.2, '印度首都'],
  ['莫斯科', 55.8, 37.6, '俄罗斯首都'],
  ['伊斯坦布尔', 41.0, 28.9, '土耳其最大城市'],
  ['巴塞罗那', 41.4, 2.2, '西班牙著名城市'],
  ['阿姆斯特丹', 52.4, 4.9, '荷兰首都'],
  ['维也纳', 48.2, 16.4, '奥地利首都'],
  ['拉斯维加斯', 36.2, -115.1, '世界娱乐之都'],
  ['墨西哥城', 19.4, -99.1, '美洲最大城市'],
  ['檀香山', 21.3, -157.8, '夏威夷首府'],
  ['马尼拉', 14.6, 120.9, '菲律宾首都'],
  ['吉隆坡', 3.1, 101.7, '马来西亚首都'],
];

function latLngToVec3(lat, lng) {
  const phi = (90 - lat) * (Math.PI / 180);
  const th  = (lng + 180) * (Math.PI / 180);
  return new THREE.Vector3(
    -Math.sin(phi) * Math.cos(th),
     Math.cos(phi),
     Math.sin(phi) * Math.sin(th)
  );
}

// ═══════════════════════════════════════════════════════════
// PROCEDURAL TEXTURES
// ═══════════════════════════════════════════════════════════
function makeDayTex() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const ctx = c.getContext('2d');

  // Ocean
  const g = ctx.createRadialGradient(512, 200, 0, 512, 256, 520);
  g.addColorStop(0,   '#3a8fc4');
  g.addColorStop(0.5, '#2a6ea8');
  g.addColorStop(1,   '#0d4070');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 1024, 512);

  // Simple continent shapes
  const lands = [
    { pts:[[102,290],[180,230],[260,255],[280,340],[240,420],[160,400],[90,360]], color:'#4a8a3a' },
    { pts:[[200,430],[250,420],[275,500],[240,570],[190,580],[175,520]], color:'#4a8a3a' },
    { pts:[[380,190],[440,170],[490,185],[510,270],[470,340],[420,355],[375,300],[360,230]], color:'#5a9a4a' },
    { pts:[[400,340],[470,340],[490,430],[450,500],[390,510],[370,440]], color:'#5a9a4a' },
    { pts:[[510,155],[680,140],[800,165],[840,300],[720,330],[580,310],[510,250]], color:'#3a7a3a' },
    { pts:[[650,450],[720,440],[745,510],[680,530],[640,490]], color:'#6a8a5a' },
    { pts:[[260,60],[400,40],[500,55],[480,110],[380,115],[270,100]], color:'#c8e8f0' },
  ];

  lands.forEach(({ pts, color }) => {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    pts.slice(1).forEach(p => ctx.lineTo(p[0], p[1]));
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.fillStyle = 'rgba(0,80,0,0.18)';
    ctx.fill();
  });

  // Grid
  ctx.strokeStyle = 'rgba(150,220,255,0.12)';
  ctx.lineWidth = 0.5;
  for (let y = 0; y <= 512; y += 64) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1024, y); ctx.stroke(); }
  for (let x = 0; x <= 1024; x += 64) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 512); ctx.stroke(); }

  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}

function makeNightTex() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#000208';
  ctx.fillRect(0, 0, 1024, 512);

  const lights = [
    [180,185],[220,155],[140,195],[240,205], // NA
    [230,280],[200,305], // SA
    [440,128],[460,155],[430,180],[480,145], // EU
    [430,255],[480,282],[500,245], // Africa
    [580,110],[660,102],[760,143],[700,128], // Asia
    [710,328], // Australia
  ];
  lights.forEach(([x, y]) => {
    const r = 3 + Math.random() * 4;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0,   'rgba(255,200,80,0.9)');
    g.addColorStop(0.4, 'rgba(255,160,50,0.4)');
    g.addColorStop(1,   'rgba(255,150,40,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  });

  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}

// ═══════════════════════════════════════════════════════════
// THREE.JS INIT
// ═══════════════════════════════════════════════════════════
const canvas = document.getElementById('three-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000005);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 5000);

let camDist = 3.5;
const CAM_MIN = 1.3, CAM_MAX = 10;
let camTheta = 0.2, camPhi = 0.4;

function updateCamera() {
  camera.position.set(
    camDist * Math.sin(camTheta) * Math.cos(camPhi),
    camDist * Math.sin(camPhi),
    camDist * Math.cos(camTheta) * Math.cos(camPhi)
  );
  camera.lookAt(0, 0, 0);
}
updateCamera();

// Stars
(function buildStars() {
  const pos = [];
  for (let i = 0; i < 4000; i++) {
    const r = 800 + Math.random() * 400;
    const th = Math.acos(2 * Math.random() - 1);
    const ph = 2 * Math.PI * Math.random();
    pos.push(r * Math.sin(th) * Math.cos(ph), r * Math.sin(th) * Math.sin(ph), r * Math.cos(th));
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.7, color: 0xffffff, sizeAttenuation: true })));
})();

// Lights
scene.add(new THREE.AmbientLight(0x112244, 0.7));
const sunLight = new THREE.DirectionalLight(0xffffff, 1.3);
sunLight.position.set(5, 2, 4);
scene.add(sunLight);
scene.add(new THREE.DirectionalLight(0x224488, 0.5));

// Earth Group
const earthGroup = new THREE.Group();
scene.add(earthGroup);

// Earth sphere
const earthGeo = new THREE.SphereGeometry(1, 64, 64);
const dayTex   = makeDayTex();
const nightTex = makeNightTex();

const earthMesh = new THREE.Mesh(earthGeo, new THREE.MeshPhongMaterial({
  map: dayTex, specular: new THREE.Color(0x223355), shininess: 12
}));
earthGroup.add(earthMesh);

const nightMesh = new THREE.Mesh(earthGeo, new THREE.MeshPhongMaterial({
  map: nightTex, transparent: true, opacity: 0.88,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
nightMesh.scale.setScalar(1.001);
earthGroup.add(nightMesh);

// Atmosphere
const atmosMat = new THREE.ShaderMaterial({
  vertexShader: 'varying vec3 vN; void main(){ vN=normalize(normalMatrix*normal); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader: 'varying vec3 vN; void main(){ float i=pow(0.65-dot(vN,vec3(0,0,1.0)),2.5); gl_FragColor=vec4(0.25,0.55,1.0,1.0)*i*0.85; }',
  side: THREE.BackSide, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true
});
earthGroup.add(new THREE.Mesh(new THREE.SphereGeometry(1.07, 48, 48), atmosMat));

// City markers
const cityMarkers = [];
(function buildCities() {
  const pos = [], cols = [];
  CITIES.forEach(([name, lat, lng]) => {
    const v = latLngToVec3(lat, lng).multiplyScalar(1.018);
    pos.push(v.x, v.y, v.z);
    cols.push(1.0, 0.85, 0.4);
  });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.Float32BufferAttribute(cols, 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
    size: 0.05, vertexColors: true, transparent: true, opacity: 0.95,
    sizeAttenuation: true, blending: THREE.AdditiveBlending, depthWrite: false
  })));

  CITIES.forEach(([name, lat, lng, desc]) => {
    const v = latLngToVec3(lat, lng).multiplyScalar(1.028);
    const mat = new THREE.MeshBasicMaterial({
      color: 0xffd060, transparent: true, opacity: 0.9,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.014, 8, 8), mat);
    mesh.position.copy(v);
    mesh.userData = { name, lat, lng, desc };
    scene.add(mesh);
    cityMarkers.push(mesh);
  });
})();

// City popup
function showCityPopup(data) {
  const { name, lat, lng, desc } = data;
  document.getElementById('popup-title').textContent = '📍 ' + name;
  document.getElementById('map-city-name').textContent = name;
  document.getElementById('map-coords').textContent =
    `${lat >= 0 ? lat + '°N' : -lat + '°S'}  ${lng >= 0 ? lng + '°E' : -lng + '°W'}`;
  document.getElementById('popup-desc').textContent = desc;
  document.getElementById('map-baidu-link').href =
    `https://api.map.baidu.com/lbsapi/getpoint/index.html?query=${encodeURIComponent(name)}`;
  document.getElementById('popup').classList.add('show');
}

// Click detection
const raycaster = new THREE.Raycaster();
const mouse2d   = new THREE.Vector2();
canvas.addEventListener('click', e => {
  mouse2d.x =  (e.clientX / window.innerWidth)  * 2 - 1;
  mouse2d.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse2d, camera);
  const hits = raycaster.intersectObjects(cityMarkers);
  if (hits.length > 0) showCityPopup(hits[0].object.userData);
});

// ═══════════════════════════════════════════════════════════
// MEDIAPIPE HANDS
// ═══════════════════════════════════════════════════════════
const videoEl  = document.getElementById('input-video');
const handCvs  = document.getElementById('hand-overlay');
const handCtx  = handCvs.getContext('2d');
const statusEl = document.getElementById('gesture-status');

let handCount = 0;
let prevWX = null, prevWY = null;
let prevPinch = null;
let rotVX = 0, rotVY = 0;
let zoomVel = 0;

const mpHands = new Hands({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});
mpHands.setOptions({
  maxNumHands: 2,
  modelComplexity: 1,
  minDetectionConfidence: 0.55,
  minTrackingConfidence: 0.50
});

mpHands.onResults(results => {
  handCvs.width  = videoEl.videoWidth  || 640;
  handCvs.height = videoEl.videoHeight || 480;
  handCtx.clearRect(0, 0, handCvs.width, handCvs.height);

  handCount = results.multiHandLandmarks ? results.multiHandLandmarks.length : 0;

  if (handCount === 0) {
    prevWX = prevWY = prevPinch = null;
    statusEl.textContent = '✋ 等待手势…';
    return;
  }

  results.multiHandLandmarks.forEach((lm, i) => {
    const col = i === 0 ? 'rgba(100,200,255,0.7)' : 'rgba(255,200,100,0.7)';
    drawConnectors(handCtx, lm, HAND_CONNECTIONS, { color: col, lineWidth: 1.5 });
    drawLandmarks(handCtx, lm, { color: i === 0 ? '#44aaff' : '#ffaa44', lineWidth: 1, radius: 2 });
  });

  if (handCount === 2) {
    const lm1 = results.multiHandLandmarks[0];
    const lm2 = results.multiHandLandmarks[1];
    const dx = lm1[0].x - lm2[0].x;
    const dy = lm1[0].y - lm2[0].y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (prevPinch !== null) zoomVel = -(dist - prevPinch) * 0.12;
    prevPinch = dist;
    prevWX = prevWY = null;
    statusEl.textContent = '🤲 双手缩放中…';
  } else {
    prevPinch = null;
    const lm = results.multiHandLandmarks[0];
    const wx = lm[0].x, wy = lm[0].y;
    if (prevWX !== null) {
      rotVX += (wx - prevWX) * 3.5;
      rotVY += (wy - prevWY) * 1.8;
    }
    prevWX = wx; prevWY = wy;
    statusEl.textContent = '🖐 旋转地球…';
  }
});

new Camera(videoEl, {
  onFrame: async () => { await mpHands.send({ image: videoEl }); },
  width: 640, height: 480
}).start().catch(() => {
  statusEl.textContent = '⚠️ 摄像头未开启';
});

// Hide loading after everything initialised
document.getElementById('loading').style.display = 'none';

// ═══════════════════════════════════════════════════════════
// ANIMATION LOOP
// ═══════════════════════════════════════════════════════════
const clock = new THREE.Clock();
let t = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  t += dt;

  // Auto spin
  camTheta += 0.0004;

  // Gesture rotate
  if (handCount === 1) {
    camTheta -= rotVX * dt;
    camPhi = Math.max(-1.3, Math.min(1.3, camPhi + rotVY * dt));
    rotVX *= 0.82; rotVY *= 0.82;
  } else {
    rotVX *= 0.9; rotVY *= 0.9;
  }

  // Gesture zoom
  if (handCount === 2) {
    camDist = Math.max(CAM_MIN, Math.min(CAM_MAX, camDist + zoomVel));
    zoomVel *= 0.78;
  } else {
    zoomVel *= 0.8;
  }

  updateCamera();
  earthGroup.rotation.y += 0.0003;

  // City pulse
  const pulse = 0.8 + Math.sin(t * 2.2) * 0.2;
  cityMarkers.forEach((m, i) => {
    m.scale.setScalar(pulse);
    m.material.opacity = 0.6 + Math.sin(t * 2.2 + i * 0.4) * 0.4;
  });

  renderer.render(scene, camera);
}
animate();

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
